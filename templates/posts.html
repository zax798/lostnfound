<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>信息展示</title>
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" /> -->
</head>
<body>
  <h1>校园失物招领信息墙</h1>
  <nav>
    <a href="/posts">信息墙</a> |
    <a href="/post_item">发布信息</a> |
    <a href="/user_me">个人中心</a> |
    <a href="/logout">退出登录</a>
  </nav>
  <hr />

  {% if posts %}
    {% for post in posts %}
      <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
        <img src="{{ url_for('static', filename='uploads/' + post.image_filename) }}" alt="物品图片" style="max-width:120px; max-height:120px; float:left; margin-right:10px;" />
        <p><strong>类型:</strong> {{ post.type }}</p>
        <p><strong>名称:</strong> {{ post.title }}</p>
        <p><strong>描述:</strong> {{ post.description }}</p>
        <p><strong>时间:</strong> {{ post.date }}</p>
        <p><strong>地点:</strong> {{ post.location }}</p>
        <div style="clear:both;"></div>
      </div>
    {% endfor %}
  {% else %}
    <p>暂无信息发布。</p>
  {% endif %}
</body>
</html>
